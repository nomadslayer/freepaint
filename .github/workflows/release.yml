name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to attach packages to
        required: true
        default: v0.1.0-alpha

permissions:
  contents: write

jobs:
  ubuntu-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Build .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb
          ls -la target/debian/
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --title "Free Paint ${TAG#v}" --generate-notes || true
          gh release upload "$TAG" target/debian/*.deb --clobber

  macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Build universal app and dmg
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          ./scripts/make-macos-app.sh --universal
          hdiutil create -volname "Free Paint" -srcfolder "dist/Free Paint.app" \
            -ov -format UDZO "FreePaint-${TAG#v}-macos-universal.dmg"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --title "Free Paint ${TAG#v}" --generate-notes || true
          gh release upload "$TAG" FreePaint-*.dmg --clobber
